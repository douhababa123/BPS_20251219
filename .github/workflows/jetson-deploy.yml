name: Jetson CI/CD Pipeline

# 触发条件
on:
  push:
    branches:
      - DEV          # DEV 分支推送自动部署到测试环境
      - main         # main 分支推送自动部署到生产环境
    paths-ignore:
      - '**.md'      # 文档更新不触发部署
      - 'docs/**'
  pull_request:
    branches:
      - DEV
      - main
  workflow_dispatch:  # 支持手动触发

# 环境变量
env:
  JETSON_USER: ${{ secrets.JETSON_USER }}           # Jetson SSH 用户名
  JETSON_HOST: ${{ secrets.JETSON_HOST }}           # Jetson IP: 10.70.80.183
  JETSON_PORT: ${{ secrets.JETSON_PORT || 22 }}    # SSH 端口，默认 22
  PROJECT_DIR: /home/${{ secrets.JETSON_USER }}/BPS_20251219

jobs:
  # Job 1: 代码质量检查和测试
  test:
    name: 代码质量检查
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      # 前端检查
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 安装前端依赖
        run: npm ci
      
      - name: TypeScript 类型检查
        run: npm run typecheck
      
      - name: ESLint 代码检查
        run: npm run lint
        continue-on-error: true  # Lint 警告不阻止部署
      
      - name: 前端构建测试
        run: npm run build
      
      # 后端检查
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: 安装后端依赖
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Python 代码检查
        run: |
          cd backend
          python -m py_compile main.py
          python -m py_compile database.py
          python -m py_compile config.py
      
      - name: 运行后端测试
        run: |
          cd backend
          pytest tests/ -v --cov=. --cov-report=xml
        continue-on-error: true  # 测试失败不阻止部署（可根据需要调整）
      
      - name: 上传测试覆盖率
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: backend
        continue-on-error: true

  # Job 2: 构建 Docker 镜像
  build:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'  # 仅推送时构建
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 QEMU（支持 ARM64）
        uses: docker/setup-qemu-action@v3
      
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 登录 Docker Hub（可选）
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true
      
      # 构建后端镜像（ARM64 架构）
      - name: 构建后端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: false  # 不推送到 Docker Hub，直接在 Jetson 上构建
          tags: bps_backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 3: 部署到 Jetson
  deploy:
    name: 部署到 Jetson
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      # 设置 SSH 密钥
      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.JETSON_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.JETSON_HOST }} >> ~/.ssh/known_hosts
      
      # 检查 Jetson 连接
      - name: 测试 SSH 连接
        run: |
          ssh -o ConnectTimeout=10 ${{ env.JETSON_USER }}@${{ env.JETSON_HOST }} "echo '✅ SSH 连接成功'"
      
      # 同步代码到 Jetson
      - name: 同步代码到 Jetson
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.env' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            ./ ${{ env.JETSON_USER }}@${{ env.JETSON_HOST }}:${{ env.PROJECT_DIR }}/
      
      # 部署到 Jetson
      - name: 执行部署脚本
        run: |
          ssh ${{ env.JETSON_USER }}@${{ env.JETSON_HOST }} << 'ENDSSH'
            set -e
            cd ${{ env.PROJECT_DIR }}
            
            echo "=========================================="
            echo "  开始部署 BPS 到 Jetson"
            echo "  分支: ${{ github.ref_name }}"
            echo "  提交: ${{ github.sha }}"
            echo "=========================================="
            
            # 确保脚本有执行权限
            chmod +x *.sh
            
            # 拉取最新代码（如果使用 Git）
            if [ -d .git ]; then
              git fetch origin
              git checkout ${{ github.ref_name }}
              git pull origin ${{ github.ref_name }}
            fi
            
            # 备份当前版本
            echo "📦 备份当前版本..."
            docker-compose ps -q | xargs docker commit || true
            
            # 停止旧容器
            echo "🛑 停止现有容器..."
            docker-compose down || true
            
            # 构建新镜像
            echo "🔨 构建新镜像..."
            docker-compose build
            
            # 启动新容器
            echo "🚀 启动新容器..."
            docker-compose up -d
            
            # 等待服务启动
            echo "⏳ 等待服务启动..."
            sleep 10
            
            # 健康检查
            echo "🏥 健康检查..."
            for i in {1..10}; do
              if curl -f -s http://localhost/api/health > /dev/null 2>&1; then
                echo "✅ 部署成功！服务正常运行"
                exit 0
              fi
              echo "等待服务启动... ($i/10)"
              sleep 3
            done
            
            # 如果健康检查失败，回滚
            echo "❌ 健康检查失败，开始回滚..."
            docker-compose logs backend
            exit 1
          ENDSSH
      
      # 部署后验证
      - name: 验证部署
        run: |
          ssh ${{ env.JETSON_USER }}@${{ env.JETSON_HOST }} << 'ENDSSH'
            cd ${{ env.PROJECT_DIR }}
            
            echo "=========================================="
            echo "  部署验证"
            echo "=========================================="
            
            # 检查容器状态
            docker-compose ps
            
            # 测试 API
            echo ""
            echo "测试 API 端点..."
            curl -f http://localhost/api/health || exit 1
            
            # 查看资源使用
            echo ""
            echo "资源使用情况:"
            docker stats --no-stream
            
            echo ""
            echo "✅ 验证完成！访问地址: http://10.70.80.183"
          ENDSSH
      
      # 发送部署通知（可选）
      - name: 发送部署通知
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            BPS 部署到 Jetson ${{ job.status }}
            分支: ${{ github.ref_name }}
            提交: ${{ github.sha }}
            作者: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

  # Job 4: 回滚（手动触发）
  rollback:
    name: 回滚到上一版本
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.JETSON_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.JETSON_HOST }} >> ~/.ssh/known_hosts
      
      - name: 执行回滚
        run: |
          ssh ${{ env.JETSON_USER }}@${{ env.JETSON_HOST }} << 'ENDSSH'
            cd ${{ env.PROJECT_DIR }}
            
            echo "=========================================="
            echo "  执行回滚操作"
            echo "=========================================="
            
            # 停止当前容器
            docker-compose down
            
            # 回到上一个提交
            git checkout HEAD~1
            
            # 重新构建和启动
            docker-compose build
            docker-compose up -d
            
            # 健康检查
            sleep 10
            if curl -f -s http://localhost/api/health > /dev/null 2>&1; then
              echo "✅ 回滚成功！"
            else
              echo "❌ 回滚失败，请手动检查"
              exit 1
            fi
          ENDSSH
