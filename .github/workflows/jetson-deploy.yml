name: Jetson CI/CD Pipeline

# 触发条件
on:
  push:
    branches:
      - DEV          # DEV 分支推送自动部署到测试环境
      - main         # main 分支推送自动部署到生产环境
    paths-ignore:
      - '**.md'      # 文档更新不触发部署
      - 'docs/**'
  pull_request:
    branches:
      - DEV
      - main
  workflow_dispatch:  # 支持手动触发

jobs:
  # Job 1: 代码质量检查和测试
  test:
    name: 代码质量检查
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      # 前端检查
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom 27 (used by Vitest) requires Node.js 20 or newer.
          node-version: '22'
          cache: 'npm'
      
      - name: 安装前端依赖
        run: npm ci
      
      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: 前端单元测试
        run: npm test
      
      - name: ESLint 代码检查
        run: npm run lint
        continue-on-error: true  # Lint 警告不阻止部署
      
      - name: 前端构建测试
        run: npm run build

      # 后端检查
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: 安装后端依赖
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Python 代码检查
        run: |
          cd backend
          python -m py_compile main.py
          python -m py_compile database.py
          python -m py_compile config.py
      
      - name: 运行后端测试
        run: |
          cd backend
          # 排除需要已启动 API/真实数据库的 requests 集成测试；这些在部署后健康检查中验证。
          UNIT_TESTS=$(grep -L -E 'requests([ ,]|$)' tests/test_*.py)
          pytest $UNIT_TESTS -v --cov=. --cov-report=xml
      
      - name: 上传测试覆盖率
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: backend
        continue-on-error: true

  # Job 2: 部署到 Jetson（使用 self-hosted runner，直接在 Jetson 上原生 ARM64 构建和部署）
  # 不在云端跨架构构建 Docker 镜像，Jetson 原生 ARM64 直接 build 更可靠
  deploy:
    name: 部署到 Jetson
    runs-on: [self-hosted, linux, arm64]
    needs: test
    if: github.event_name == 'push' && needs.test.result == 'success'
    
    steps:
      - name: 拉取 Docker 基础镜像（带重试）
        run: |
          echo "📦 预拉取基础镜像，避免构建时超时..."
          for i in 1 2 3; do
            docker pull python:3.9-slim-bullseye && echo "✅ 基础镜像拉取成功" && break
            echo "⚠️ 第 $i 次拉取失败，等待 10s 后重试..."
            sleep 10
          done
          # 检查镜像是否已在本地（即使拉取失败，缓存可能已存在）
          docker image inspect python:3.9-slim-bullseye > /dev/null 2>&1 && echo "✅ 镜像已在本地缓存" || echo "⚠️ 镜像不在本地，构建将尝试拉取"

      - name: 执行部署
        run: |
          set -e
          echo "=========================================="
          echo "  开始部署 BPS 到 Jetson"
          echo "  分支: ${{ github.ref_name }}"
          echo "  提交: ${{ github.sha }}"
          echo "=========================================="

          # 使用本地仓库，只做增量 git pull（避免从 GitHub 重新下载全部代码）
          cd /mnt/nvme/BPS

          echo "📥 拉取最新代码..."
          git fetch --depth=1 origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}

          # 构建前端 dist/（nginx 需要此目录）
          echo "🏗️ 构建前端..."
          if command -v node > /dev/null 2>&1; then
            npm ci --prefer-offline 2>/dev/null || npm ci
            npm run build
            echo "✅ 前端构建完成"
          elif [ -d "dist" ]; then
            echo "⚠️ Node.js 不可用，使用已有 dist/ 目录"
          else
            echo "❌ Node.js 不可用且 dist/ 不存在，前端无法部署"
            exit 1
          fi

          # 停止旧容器
          echo "🛑 停止现有容器..."
          docker compose down || true

          # 构建新镜像（使用本地缓存的基础镜像，不再重新 pull）
          echo "🔨 构建新镜像..."
          docker compose build --pull=false

          # 使用新后端镜像，在服务启动前安全收紧能力等级约束
          echo "🔧 应用能力等级 0-4 数据库约束..."
          docker compose run --rm --no-deps backend \
            python run_migration.py migrations/006_competency_levels_0_4.sql

          # 启动新容器
          echo "🚀 启动新容器..."
          docker compose up -d

          # 等待服务启动后做健康检查
          echo "⏳ 等待服务启动..."
          for i in $(seq 1 12); do
            if curl -f -s http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "✅ 部署成功！服务正常运行"
              docker compose ps
              exit 0
            fi
            echo "等待中... ($i/12)"
            sleep 5
          done

          echo "❌ 健康检查失败"
          docker compose logs --tail=50 backend
          exit 1
