name: Jetson CI/CD Pipeline

# 触发条件
on:
  push:
    branches:
      - DEV          # DEV 分支推送自动部署到测试环境
      - main         # main 分支推送自动部署到生产环境
    paths-ignore:
      - '**.md'      # 文档更新不触发部署
      - 'docs/**'
  pull_request:
    branches:
      - DEV
      - main
  workflow_dispatch:  # 支持手动触发

# 环境变量
env:
  JETSON_USER: ${{ secrets.JETSON_USER }}           # Jetson SSH 用户名
  JETSON_HOST: ${{ secrets.JETSON_HOST }}           # Jetson IP
  JETSON_PORT: ${{ secrets.JETSON_PORT || 22 }}    # SSH 端口，默认 22
  PROJECT_DIR: /mnt/nvme/BPS

jobs:
  # Job 1: 代码质量检查和测试
  test:
    name: 代码质量检查
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      # 前端检查
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 安装前端依赖
        run: npm ci
      
      - name: TypeScript 类型检查
        run: npm run typecheck
      
      - name: ESLint 代码检查
        run: npm run lint
        continue-on-error: true  # Lint 警告不阻止部署
      
      - name: 前端构建测试
        run: npm run build
      
      # 后端检查
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: 安装后端依赖
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Python 代码检查
        run: |
          cd backend
          python -m py_compile main.py
          python -m py_compile database.py
          python -m py_compile config.py
      
      - name: 运行后端测试
        run: |
          cd backend
          pytest tests/ -v --cov=. --cov-report=xml
        continue-on-error: true  # 测试失败不阻止部署（可根据需要调整）
      
      - name: 上传测试覆盖率
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: backend
        continue-on-error: true

  # Job 2: 构建 Docker 镜像
  build:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'  # 仅推送时构建
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 QEMU（支持 ARM64）
        uses: docker/setup-qemu-action@v3
      
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 登录 Docker Hub（可选）
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true
      
      # 构建后端镜像（ARM64 架构）
      - name: 构建后端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: false  # 不推送到 Docker Hub，直接在 Jetson 上构建
          tags: bps_backend:${{ github.sha }}
          no-cache: true

  # Job 3: 部署到 Jetson（使用 self-hosted runner，直接在 Jetson 上运行）
  deploy:
    name: 部署到 Jetson
    runs-on: [self-hosted, linux, arm64]
    needs: [test, build]
    if: github.event_name == 'push'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 执行部署
        run: |
          set -e
          echo "=========================================="
          echo "  开始部署 BPS 到 Jetson"
          echo "  分支: ${{ github.ref_name }}"
          echo "  提交: ${{ github.sha }}"
          echo "  工作目录: $GITHUB_WORKSPACE"
          echo "=========================================="

          # 代码已由 actions/checkout 检出到 $GITHUB_WORKSPACE，直接使用
          cd "$GITHUB_WORKSPACE"

          # 停止旧容器
          echo "🛑 停止现有容器..."
          docker compose down || true

          # 构建新镜像
          echo "🔨 构建新镜像..."
          docker compose build

          # 启动新容器
          echo "🚀 启动新容器..."
          docker compose up -d

          # 等待服务启动后做健康检查
          echo "⏳ 等待服务启动..."
          for i in $(seq 1 12); do
            if curl -f -s http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "✅ 部署成功！服务正常运行"
              docker compose ps
              exit 0
            fi
            echo "等待中... ($i/12)"
            sleep 5
          done

          echo "❌ 健康检查失败"
          docker compose logs --tail=50 backend
          exit 1

  # Job 4: 回滚（手动触发，同样在 Jetson self-hosted runner 上运行）
  rollback:
    name: 回滚到上一版本
    runs-on: [self-hosted, linux, arm64]
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: 检出上一版本
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 获取最近2个提交，才能 HEAD~1

      - name: 执行回滚
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          echo "=========================================="
          echo "  执行回滚操作"
          echo "=========================================="

          # 切换到上一个提交
          git checkout HEAD~1

          # 停止当前容器
          docker compose down

          # 重新构建和启动
          docker compose build
          docker compose up -d

          # 健康检查
          sleep 15
          if curl -f -s http://localhost:8000/api/health > /dev/null 2>&1; then
            echo "✅ 回滚成功！"
          else
            echo "❌ 回滚失败，请手动检查"
            exit 1
          fi
